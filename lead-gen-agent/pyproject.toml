[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-lead-gen-agent"
version = "1.0.0"
description = "AI-powered B2B lead generation agent — find, enrich, score and email cold leads autonomously"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["lead-generation", "sales", "ai", "outreach", "b2b"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "googlesearch-python>=1.2.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "dnspython>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "tavily-python>=0.3.0",
]

[project.optional-dependencies]
sheets = [
    "gspread>=6.1.0",
    "google-auth>=2.36.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[project.scripts]
agent = "cli.main:cli"

[project.urls]
Homepage = "https://github.com/adviksingal/ai-lead-gen"
Repository = "https://github.com/adviksingal/ai-lead-gen"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
